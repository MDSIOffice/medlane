<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medlane OS footer — reference</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #F3F6F8; font-family: 'Manrope', system-ui, sans-serif; }
  .demo { min-height: 100vh; display: flex; flex-direction: column; }
  .demo main { flex: 1; padding: 24px 28px; color: #4F5D6B; font-size: 14px; }

  /* ---- Footer ---- */
  .app-footer {
    border-top: 1px solid #DFE5EA; background: #FFFFFF;
    padding: 12px 28px; box-sizing: border-box;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 6px 24px; font-size: 13px; color: #5B6876;
  }
  .app-footer__left, .app-footer__right { display: flex; flex-wrap: wrap; align-items: center; }
  .app-footer__left { gap: 4px 12px; }
  .app-footer__right { gap: 2px 16px; }
  .app-footer__brand { font-weight: 800; color: #12202E; }
  .app-footer__divider { width: 1px; height: 14px; background: #CBD3DB; }
  .app-footer__name { font-weight: 700; color: #12202E; }
  .app-footer__link {
    min-height: 36px; display: inline-flex; align-items: center; gap: 6px;
    color: #1F5F74; font-weight: 600; text-decoration: none; font-variant-numeric: tabular-nums;
  }
  .app-footer__link:hover { text-decoration: underline; color: #163F4D; }
  .app-footer__icon {
    width: 36px; height: 36px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; color: #1F5F74;
  }
  .app-footer__icon:hover { background: #EEF3F6; }
  .app-footer a:focus-visible { outline: 2px solid #1F5F74; outline-offset: 2px; }
  @media (max-width: 640px) { .app-footer { padding: 12px 16px; } .app-footer__divider { display: none; } }
</style>
</head>
<body>
<div class="demo">
  <main>Page content…</main>

  <footer class="app-footer">
    <div class="app-footer__left">
      <span class="app-footer__brand">Medlane OS</span>
      <span class="app-footer__divider" aria-hidden="true"></span>
      <span>© 2026 Medlane. All rights reserved.</span>
    </div>
    <div class="app-footer__right">
      <span>Designed &amp; developed by <span class="app-footer__name">Geo Dominic Pineda</span></span>
      <a class="app-footer__link" href="mailto:geodominic.pineda@gmail.com">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
        geodominic.pineda@gmail.com
      </a>
      <a class="app-footer__link" href="tel:+639613479462">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
        +63 961 347 9462
      </a>
      <a class="app-footer__icon" href="INSTAGRAM_URL" target="_blank" rel="noopener noreferrer" aria-label="Geo Dominic Pineda on Instagram" title="Instagram">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5v.01"/></svg>
      </a>
    </div>
  </footer>
</div>
</body>
</html>
