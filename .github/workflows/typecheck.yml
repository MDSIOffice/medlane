name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck browser scripts
        run: npm run typecheck
      - name: Typecheck worker
        run: npm run typecheck:worker
      - name: noImplicitAny gate (per file)
        run: npm run check:noimplicitany
      - name: Syntax check
        run: for f in public/scripts/*.js src/*.js; do node --check "$f"; done
